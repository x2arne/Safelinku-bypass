<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tembus — buka link safelinku langsung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#06121f; --teal:#1fd1c0; --coral:#ff6b5e; --gold:#ffc65c; --violet:#6a5cff;
  --ink:#f4fbff; --ink-dim:rgba(244,251,255,.66);
  --edge:rgba(255,255,255,.34);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);background:var(--deep);
  display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}

/* latar warna supaya efek kaca kelihatan */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0c2a44 0%,var(--deep) 65%)}
.blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.95;animation:drift 22s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:radial-gradient(circle at 35% 35%,var(--teal),transparent 68%)}
.b2{width:40vmax;height:40vmax;right:-14vmax;top:18vh;background:radial-gradient(circle at 40% 40%,var(--violet),transparent 68%);animation-duration:27s}
.b3{width:34vmax;height:34vmax;left:12vw;bottom:-14vmax;background:radial-gradient(circle at 50% 50%,var(--coral),transparent 66%);animation-duration:31s}
.b4{width:16vmax;height:16vmax;right:18vw;bottom:14vh;background:radial-gradient(circle,var(--gold),transparent 66%);animation-duration:19s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.12)}}

/* kaca cair */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.08);
  backdrop-filter:blur(20px) saturate(190%) brightness(1.08);
  border:1px solid var(--edge);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.55),
    inset 0 -1.5px 0 rgba(255,255,255,.12),
    inset 1.5px 0 0 rgba(255,255,255,.2),
    0 30px 80px -20px rgba(0,0,0,.55);
}
.chromium .glass{backdrop-filter:url(#refract) blur(14px) saturate(190%) brightness(1.08)}
.glass::before{ /* kilau yang mengikuti kursor */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.34),transparent 62%);
  mix-blend-mode:soft-light;
}

main{width:min(560px,100%);border-radius:44px;padding:clamp(26px,5vw,44px)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(2.2rem,8vw,3.3rem);line-height:.98;letter-spacing:-.03em}
.sub{margin-top:12px;color:var(--ink-dim);font-size:1.02rem;line-height:1.5;max-width:42ch}

form{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.field{border-radius:999px;display:flex;align-items:center;padding:6px 6px 6px 22px;gap:8px;background:rgba(6,18,31,.28);
  border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
.field:focus-within{border-color:rgba(255,255,255,.7);box-shadow:inset 0 2px 8px rgba(0,0,0,.25),0 0 0 4px rgba(31,209,192,.28)}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:1rem;padding:14px 0}
input::placeholder{color:rgba(244,251,255,.42)}
button{font:inherit;cursor:pointer;color:#04202a}
.go{
  border:0;border-radius:999px;padding:14px 24px;font-weight:500;
  background:linear-gradient(180deg,#d9fff9,var(--teal));
  box-shadow:inset 0 1.5px 0 #fff,0 8px 22px -6px rgba(31,209,192,.7);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .18s;
}
.go:hover{filter:brightness(1.06)}
.go:active{transform:scale(.94)}
.go[disabled]{opacity:.6;cursor:progress}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.out{margin-top:22px;border-radius:28px;padding:18px 20px;display:none}
.out.show{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.out .label{font-size:.85rem;color:var(--ink-dim)}
.out .link{margin-top:6px;word-break:break-all;font-weight:500;line-height:1.4}
.out.err .link{color:#ffd0ca}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);border-radius:999px;padding:10px 18px;color:var(--ink);text-decoration:none;font-size:.95rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.pill:hover{background:rgba(255,255,255,.26)}
.status{margin-top:16px;min-height:1.4em;color:var(--ink-dim);font-size:.95rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:8px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
footer{margin-top:22px;font-size:.82rem;color:rgba(244,251,255,.45);line-height:1.5}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="refract" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<main class="glass" id="card">
  <h1>Tembus link safelinku</h1>
  <p class="sub">Tempel link-nya, tunggu beberapa detik, lalu dapat tujuan aslinya.</p>

  <form id="f">
    <div class="field glass">
      <input id="u" type="url" inputmode="url" autocomplete="off" required placeholder="https://safelinku.com/..." aria-label="Link safelinku">
      <button class="go" id="b" type="submit">Buka link</button>
    </div>
  </form>

  <div class="status" id="s" role="status" aria-live="polite"></div>

  <section class="out glass" id="o" aria-live="polite">
    <div class="label" id="l">Tujuan</div>
    <div class="link" id="r"></div>
    <div class="row" id="a">
      <a class="pill" id="open" target="_blank" rel="noopener noreferrer">Buka</a>
      <button class="pill" id="copy" type="button">Salin</button>
    </div>
  </section>

  <footer>Server menunggu timer link, jadi proses bisa 5–20 detik. Link dengan captcha belum bisa diproses.</footer>
</main>

<script>
if (window.chrome) document.documentElement.classList.add("chromium");

// kilau mengikuti pointer
const card = document.getElementById("card");
card.addEventListener("pointermove", e => {
  const r = card.getBoundingClientRect();
  card.style.setProperty("--mx", (e.clientX - r.left) + "px");
  card.style.setProperty("--my", (e.clientY - r.top) + "px");
});

const $ = id => document.getElementById(id);
const f = $("f"), u = $("u"), b = $("b"), s = $("s"), o = $("o");

f.addEventListener("submit", async e => {
  e.preventDefault();
  o.classList.remove("show", "err");
  b.disabled = true;
  s.innerHTML = '<span class="dot"></span>Membaca halaman dan menunggu timer…';
  try {
    const res = await fetch("/api/resolve?url=" + encodeURIComponent(u.value.trim()));
    const d = await res.json();
    if (d.ok) {
      $("l").textContent = "Tujuan";
      $("r").textContent = d.url;
      $("open").href = d.url;
      $("a").style.display = "flex";
      s.textContent = "Selesai.";
    } else {
      o.classList.add("err");
      $("l").textContent = "Gagal";
      $("r").textContent = d.error || "Tidak diketahui.";
      $("a").style.display = "none";
      s.textContent = "";
    }
  } catch {
    o.classList.add("err");
    $("l").textContent = "Gagal";
    $("r").textContent = "Server tidak bisa dihubungi. Cek koneksi lalu coba lagi.";
    $("a").style.display = "none";
    s.textContent = "";
  }
  o.classList.add("show");
  b.disabled = false;
});

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("r").textContent); $("copy").textContent = "Tersalin"; }
  catch { $("copy").textContent = "Salin manual"; }
  setTimeout(() => $("copy").textContent = "Salin", 1500);
});
</script>
</body>
</html>
